<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liszt 的小天地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff8fb8;
    --hot: #ff5c9e;
    --soft: #ffd6e7;
    --cream: #fff8fb;
    --berry: #b3245f;
    --sky: #bfe3ff;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--berry);
    /* 粉紅格子布背景 */
    background-color: var(--soft);
    background-image:
      linear-gradient(90deg, rgba(255,255,255,.55) 50%, transparent 50%),
      linear-gradient(rgba(255,255,255,.55) 50%, transparent 50%);
    background-size: 44px 44px;
    padding:
      calc(env(safe-area-inset-top, 0px) + 28px) 20px
      calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 440px;
    text-align: center;
  }

  /* 漂浮的小圖案 */
  .float {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    animation: drift 5s ease-in-out infinite;
  }
  .f1 { top: 6%;  left: 6%;  width: 34px; animation-delay: 0s; }
  .f2 { top: 14%; right: 7%; width: 28px; animation-delay: 1s; }
  .f3 { top: 46%; left: 4%;  width: 26px; animation-delay: 2s; }
  .f4 { top: 62%; right: 5%; width: 36px; animation-delay: .5s; }
  .f5 { bottom: 8%; left: 10%; width: 30px; animation-delay: 1.5s; }
  .f6 { bottom: 14%; right: 12%; width: 24px; animation-delay: 2.5s; }

  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-10px) rotate(6deg); }
  }

  .wrap { position: relative; z-index: 1; }

  /* 頭像區 */
  .avatar {
    width: 190px;
    height: 190px;
    margin: 0 auto;
    display: block;
    filter: drop-shadow(0 8px 0 rgba(179, 36, 95, .18));
  }

  h1 {
    font-family: "Chango", "Noto Sans TC", sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 15vw, 4.2rem);
    line-height: 1.05;
    margin-top: 6px;
    color: var(--cream);
    -webkit-text-stroke: 2px var(--berry);
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 var(--hot);
  }

  .tagline {
    display: inline-block;
    margin-top: 22px;
    padding: 10px 20px;
    font-size: 1.02rem;
    line-height: 1.7;
    background: var(--cream);
    border: 3px solid var(--berry);
    border-radius: 999px;
    box-shadow: 4px 4px 0 var(--pink);
  }

  /* 聯絡卡片 */
  .links {
    margin-top: 32px;
    display: grid;
    gap: 18px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 18px;
    text-align: left;
    font: inherit;
    color: var(--berry);
    background: var(--cream);
    border: 3px solid var(--berry);
    border-radius: 26px;
    box-shadow: 5px 5px 0 var(--hot);
    text-decoration: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover  { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--hot); }
  .card:active { transform: translate(4px, 4px);  box-shadow: 1px 1px 0 var(--hot); }
  .card:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

  .card.alt { box-shadow: 5px 5px 0 #7cc4f5; }
  .card.alt:hover  { box-shadow: 7px 7px 0 #7cc4f5; }
  .card.alt:active { box-shadow: 1px 1px 0 #7cc4f5; }

  .icon {
    flex: none;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--pink);
    border: 3px solid var(--berry);
  }
  .card.alt .icon { background: var(--sky); }
  .icon svg { width: 24px; height: 24px; }

  .card b { display: block; font-size: 1.05rem; }
  .card .sub { display: block; font-size: .93rem; margin-top: 2px; opacity: .8; }

  .hint {
    margin-left: auto;
    font-size: .78rem;
    font-weight: 700;
    color: var(--cream);
    background: var(--hot);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }

  /* 一排小圖案分隔線 */
  .divider {
    margin: 34px auto 0;
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .divider svg { width: 26px; height: 26px; }

  footer {
    margin-top: 14px;
    font-size: .85rem;
    opacity: .75;
  }

  @media (prefers-reduced-motion: reduce) {
    .float { animation: none; }
    .card { transition: none; }
  }
</style>
</head>
<body>

<!-- 漂浮小圖案：愛心、星星、亮晶晶 -->
<svg class="float f1" viewBox="0 0 24 24"><path d="M12 21C5 15 2 11.5 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3.500-3 7-10 13z" fill="#ff5c9e"/></svg>
<svg class="float f2" viewBox="0 0 24 24"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff8fb" stroke="#b3245f" stroke-width="1.5" stroke-linejoin="round"/></svg>
<svg class="float f3" viewBox="0 0 24 24"><path d="M12 21C5 15 2 11.5 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3.500-3 7-10 13z" fill="#fff8fb" stroke="#b3245f" stroke-width="1.5"/></svg>
<svg class="float f4" viewBox="0 0 24 24"><path d="M12 2l2.900 6.500 7.100.7-5.300 4.800 1.500 7L12 17.300 5.800 21l1.500-7L2 9.200l7.100-.7z" fill="#ffe27a" stroke="#b3245f" stroke-width="1.5" stroke-linejoin="round"/></svg>
<svg class="float f5" viewBox="0 0 24 24"><path d="M12 21C5 15 2 11.5 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3.500-3 7-10 13z" fill="#ff8fb8"/></svg>
<svg class="float f6" viewBox="0 0 24 24"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#bfe3ff" stroke="#b3245f" stroke-width="1.5" stroke-linejoin="round"/></svg>

<main>
  <div class="wrap">

    <!-- 頭像：可愛粉紅小熊（原創插圖） -->
    <svg class="avatar" viewBox="0 0 200 200" role="img" aria-label="戴著蝴蝶結的粉紅小熊">
      <!-- 耳朵 -->
      <circle cx="46" cy="52" r="26" fill="#ff8fb8" stroke="#b3245f" stroke-width="4"/>
      <circle cx="154" cy="52" r="26" fill="#ff8fb8" stroke="#b3245f" stroke-width="4"/>
      <circle cx="46" cy="52" r="13" fill="#ffd6e7"/>
      <circle cx="154" cy="52" r="13" fill="#ffd6e7"/>
      <!-- 臉 -->
      <ellipse cx="100" cy="112" rx="72" ry="66" fill="#ff8fb8" stroke="#b3245f" stroke-width="4"/>
      <!-- 嘴巴區 -->
      <ellipse cx="100" cy="132" rx="30" ry="22" fill="#fff8fb" stroke="#b3245f" stroke-width="3"/>
      <!-- 眼睛 -->
      <circle cx="68" cy="106" r="8" fill="#b3245f"/>
      <circle cx="132" cy="106" r="8" fill="#b3245f"/>
      <circle cx="71" cy="103" r="2.800" fill="#fff"/>
      <circle cx="135" cy="103" r="2.800" fill="#fff"/>
      <!-- 腮紅 -->
      <ellipse cx="50" cy="130" rx="11" ry="7" fill="#ff5c9e" opacity=".55"/>
      <ellipse cx="150" cy="130" rx="11" ry="7" fill="#ff5c9e" opacity=".55"/>
      <!-- 鼻子嘴 -->
      <ellipse cx="100" cy="122" rx="7" ry="5" fill="#b3245f"/>
      <path d="M100 127 V134 M100 134 Q93 142 86 136 M100 134 Q107 142 114 136" fill="none" stroke="#b3245f" stroke-width="3" stroke-linecap="round"/>
      <!-- 蝴蝶結 -->
      <g transform="translate(100 46)">
        <path d="M0 0 L-28 -16 Q-36 0 -28 16 Z" fill="#ff5c9e" stroke="#b3245f" stroke-width="4" stroke-linejoin="round"/>
        <path d="M0 0 L28 -16 Q36 0 28 16 Z" fill="#ff5c9e" stroke="#b3245f" stroke-width="4" stroke-linejoin="round"/>
        <circle r="8" fill="#ffd6e7" stroke="#b3245f" stroke-width="4"/>
      </g>
    </svg>

    <h1>Liszt</h1>

    <!-- ✏️ 想改自我介紹就改這裡 -->
    <p class="tagline">嗨，我是 Liszt 🎀<br>歡迎來我的小小天地～</p>

    <section class="links" aria-label="聯絡方式">
      <a class="card" href="https://www.instagram.com/17.__liszt/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b3245f" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.500" cy="6.500" r="1" fill="#b3245f" stroke="none"/>
          </svg>
        </span>
        <span>
          <b>Instagram</b>
          <span class="sub">17.__liszt</span>
        </span>
        <span class="hint">追蹤我</span>
      </a>

      <button class="card alt" type="button" id="phone" data-number="0966652811">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b3245f" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.900v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.3 1.800.6 2.800.7a2 2 0 0 1 1.700 2z"/>
          </svg>
        </span>
        <span>
          <b>電話</b>
          <span class="sub">0966-652-811</span>
        </span>
        <span class="hint" id="phoneHint">點一下複製</span>
      </button>
    </section>

    <!-- 小圖案分隔線 -->
    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 21C5 15 2 11.500 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3.500-3 7-10 13z" fill="#ff5c9e"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2l2.900 6.500 7.100.7-5.300 4.800 1.500 7L12 17.300 5.800 21l1.500-7L2 9.200l7.100-.7z" fill="#ffe27a" stroke="#b3245f" stroke-width="1.500" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 21C5 15 2 11.500 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3.500-3 7-10 13z" fill="#ff8fb8"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2l2.900 6.500 7.100.7-5.300 4.800 1.500 7L12 17.300 5.800 21l1.500-7L2 9.200l7.100-.7z" fill="#bfe3ff" stroke="#b3245f" stroke-width="1.500" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 21C5 15 2 11.500 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3.500-3 7-10 13z" fill="#ff5c9e"/></svg>
    </div>

    <footer>© Liszt 💗</footer>
  </div>
</main>

<script>
  const btn = document.getElementById('phone');
  const hint = document.getElementById('phoneHint');
  let timer;

  btn.addEventListener('click', async () => {
    const number = btn.dataset.number;
    try {
      await navigator.clipboard.writeText(number);
      hint.textContent = '已複製 ✓';
      clearTimeout(timer);
      timer = setTimeout(() => (hint.textContent = '點一下複製'), 1800);
    } catch (e) {
      // 剪貼簿不能用時，改成直接撥號
      window.location.href = 'tel:' + number;
    }
  });
</script>
</body>
</html>
