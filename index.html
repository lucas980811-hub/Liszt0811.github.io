<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臭狗 ❤️ 小胖主人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#fff0f5;
    --pink2:#ffd6e8;
    --rose:#ff4d79;
    --plum:#9d4edd;
    --text:#5a3a4a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:linear-gradient(160deg, var(--pink1), #f3e8ff 70%);
    overflow:hidden;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--text);
  }
  #trail{ position:fixed; inset:0; pointer-events:none; z-index:5; }

  .screen{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    z-index:10;
  }
  .brand{
    font-family:'Zhi Mang Xing', cursive;
    font-size:44px; color:var(--rose); margin:0 0 6px;
  }
  .sub{ font-size:14px; color:var(--text); opacity:0.75; margin:0 0 26px; }

  button.cta{
    padding:12px 34px; border-radius:999px; border:none;
    background:var(--rose); color:#fff; font-size:16px;
    font-family:inherit; cursor:pointer; box-shadow:0 8px 20px rgba(255,77,121,0.35);
    transition:transform 0.15s ease;
  }
  button.cta:hover{ transform:translateY(-2px); }
  button.cta:focus-visible{ outline:2px solid var(--plum); outline-offset:3px; }

  #hud{
    position:fixed; top:20px; left:0; right:0; z-index:8;
    display:flex; justify-content:center; align-items:center; gap:8px;
    font-size:15px; pointer-events:none;
  }
  #hud span{ font-weight:600; color:var(--rose); }

  .heart{
    position:absolute; font-size:30px; cursor:pointer;
    user-select:none; z-index:6; line-height:1;
    filter:drop-shadow(0 4px 8px rgba(255,77,121,0.25));
  }

  .float-msg{
    position:fixed; z-index:9; font-size:14px; color:var(--rose);
    font-weight:600; pointer-events:none; white-space:nowrap;
    animation:floatUp 1.4s ease forwards;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translateY(0); }
    15%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-60px); }
  }

  #ending{
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(160deg, #ffe3ee, #efe0ff);
    text-align:center; padding:20px;
  }
  #ending .msg{
    font-family:'Zhi Mang Xing', cursive;
    font-size:34px; color:var(--rose); max-width:480px; line-height:1.6;
    margin-bottom:22px;
  }
  #ending button{
    margin-top:6px; background:transparent; border:1.5px solid var(--rose);
    color:var(--rose); padding:9px 26px; border-radius:999px;
    font-family:inherit; font-size:14px; cursor:pointer;
  }

  #hidden{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .float-msg{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="trail"></canvas>

<div id="hud" class="hidden" style="display:none;">收集了 <span id="score">0</span> 顆 ❤️</div>

<div class="screen" id="startScreen">
  <p class="brand">臭狗 ❤️ 小胖主人</p>
  <p class="sub">接住愛心,給你一個驚喜</p>
  <button class="cta" id="startBtn">點我開始</button>
</div>

<div id="ending">
  <div class="msg" id="endingMsg"></div>
  <button id="replayBtn">再玩一次</button>
</div>

<script>
(function(){
  "use strict";

  // ------- 改名字改這裡就好 -------
  const nameHer = "小胖主人";
  const nameMe  = "臭狗";
  const winScore = 15;
  // --------------------------------

  const sweetLines = [
    `想到${nameHer}就笑了 ❤️`,
    `${nameMe}最愛${nameHer} ❤️`,
    `抱抱 ❤️`,
    `今天也要笑笑的 ❤️`,
    `每天都想見到你 ❤️`,
    `你是全世界 ❤️`,
    `再靠近一點點 ❤️`
  ];

  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const ending = document.getElementById('ending');
  const endingMsg = document.getElementById('endingMsg');
  const replayBtn = document.getElementById('replayBtn');

  let score = 0;
  let spawnTimer = null;
  let playing = false;

  function randomBetween(a,b){ return a + Math.random()*(b-a); }

  function spawnHeart(){
    if(!playing) return;
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = '❤️';
    const x = randomBetween(6, 94);
    const size = randomBetween(22, 38);
    el.style.left = x + 'vw';
    el.style.top = '105vh';
    el.style.fontSize = size + 'px';
    document.body.appendChild(el);

    const duration = randomBetween(4200, 6800);
    const drift = randomBetween(-40, 40);
    const start = performance.now();

    function animate(now){
      const p = Math.min((now - start) / duration, 1);
      el.style.transform = `translate(${drift * p}px, ${-p * (window.innerHeight + 200)}px) rotate(${p*20}deg)`;
      el.style.opacity = 1 - p*0.15;
      if(p < 1 && el.parentNode){
        requestAnimationFrame(animate);
      } else if(el.parentNode){
        el.remove();
      }
    }
    requestAnimationFrame(animate);

    el.addEventListener('click', ()=> popHeart(el));
  }

  function popHeart(el){
    if(!el.parentNode) return;
    const rect = el.getBoundingClientRect();
    score++;
    scoreEl.textContent = score;

    const msg = document.createElement('div');
    msg.className = 'float-msg';
    msg.textContent = sweetLines[Math.floor(Math.random()*sweetLines.length)];
    msg.style.left = rect.left + 'px';
    msg.style.top = rect.top + 'px';
    document.body.appendChild(msg);
    setTimeout(()=> msg.remove(), 1500);

    el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
    el.style.transform += ' scale(1.6)';
    el.style.opacity = '0';
    setTimeout(()=> el.remove(), 200);

    if(score >= winScore){
      finishGame();
    }
  }

  function finishGame(){
    playing = false;
    clearInterval(spawnTimer);
    document.querySelectorAll('.heart').forEach(h=>h.remove());
    endingMsg.textContent = `${nameHer},${nameMe}永遠愛你 ❤️`;
    ending.style.display = 'flex';
  }

  function startGame(){
    startScreen.style.display = 'none';
    hud.style.display = 'flex';
    ending.style.display = 'none';
    score = 0;
    scoreEl.textContent = 0;
    playing = true;
    spawnTimer = setInterval(spawnHeart, 550);
  }

  startBtn.addEventListener('click', startGame);
  replayBtn.addEventListener('click', startGame);

  // ------- 滑鼠愛心軌跡 -------
  const canvas = document.getElementById('trail');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  let trailParticles = [];
  function addTrail(x,y){
    trailParticles.push({
      x, y,
      vx:(Math.random()-0.5)*0.6,
      vy:-0.6 - Math.random()*0.6,
      life:1,
      size:8 + Math.random()*8
    });
    if(trailParticles.length > 80) trailParticles.shift();
  }
  window.addEventListener('mousemove', e=> addTrail(e.clientX, e.clientY));
  window.addEventListener('touchmove', e=>{
    if(e.touches[0]) addTrail(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  function drawHeart(x,y,size,alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x,y);
    ctx.scale(size/20, size/20);
    ctx.beginPath();
    ctx.moveTo(0,4);
    ctx.bezierCurveTo(0,-2,-10,-2,-10,5);
    ctx.bezierCurveTo(-10,12,0,16,0,20);
    ctx.bezierCurveTo(0,16,10,12,10,5);
    ctx.bezierCurveTo(10,-2,0,-2,0,4);
    ctx.fillStyle = '#ff4d79';
    ctx.fill();
    ctx.restore();
  }

  function loop(){
    ctx.clearRect(0,0,W,H);
    trailParticles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      drawHeart(p.x, p.y, p.size * p.life, Math.max(p.life,0)*0.7);
    });
    trailParticles = trailParticles.filter(p=>p.life > 0);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

</body>
</html>
